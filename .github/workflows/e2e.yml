name: E2E

# On every pull request, and on main after each merge — the commit the
# release publishes from, which a pull request's run did not test after
# another merged before it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # A healthy run takes about 5 minutes. Without a limit, a job that hangs
    # runs for GitHub's default of 6 hours and holds the pull request — and the
    # Release that waits on it — for all of that time.
    timeout-minutes: 25
    steps:
      # Pinned to commits, as in release.yml; Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.0.8

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No step is skipped when something is missing: a moved config or an
      # empty spec folder fails the job (Playwright exits non-zero on "No tests
      # found") instead of passing it with nothing run. All three engines the
      # config has projects for: a missing one fails its tests at launch.
      #
      # `--with-deps` apt-installs about 140 MB of system libraries from the
      # runner's Ubuntu mirror (azure.archive.ubuntu.com). Twice on 2026-11-06
      # that mirror slowed to about 40 KB/s on one runner: one install ran 37
      # minutes until it was cancelled by hand, the next hit the 10-minute limit
      # below. A healthy install takes under a minute.
      #
      # So the mirror is not asked for those packages on every run. apt keeps
      # what it downloads in /var/cache/lk-apt, and that folder and the browsers
      # are cached between runs, keyed on the Ubuntu release and the Playwright
      # version. With the cache restored apt still reads the mirror's package
      # index (about 5 MB) but downloads no package it already holds, only one
      # Ubuntu has updated since. Caches saved by main's runs serve every
      # pull request.
      #
      # When the cache misses (a new Playwright or Ubuntu release, or GitHub
      # evicted it) the mirror is used as before, with two guards:
      # - apt gives up on a download that sends nothing for 30 seconds and tries
      #   it again, up to five times, instead of waiting minutes per package;
      # - the install fails after 10 minutes, so a mirror that is slow but not
      #   stalled fails the run, marked as a timeout, and a re-run is the fix.
      - name: Prepare the Playwright cache
        id: playwright
        run: |
          # Only the "Version 1.64.1" line: pnpm can print notes of its own.
          version="$(pnpm exec playwright --version | sed -n 's/^Version \([0-9][0-9.]*\)$/\1/p')"
          . /etc/os-release
          test -n "$version" && test -n "$ID" && test -n "$VERSION_ID"
          echo "release=playwright-$ID-$VERSION_ID-" >> "$GITHUB_OUTPUT"
          echo "key=playwright-$ID-$VERSION_ID-$version" >> "$GITHUB_OUTPUT"
          # The folder the cache restores into, so it must exist and belong to
          # the runner first; `partial` is where apt's download user writes.
          sudo install -d -o "$USER" /var/cache/lk-apt
          sudo install -d -o _apt -m 700 /var/cache/lk-apt/partial
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nDir::Cache::Archives "/var/cache/lk-apt/";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-lk-playwright

      - name: Restore the Playwright cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # A cache download that stalls is dropped after 2 minutes and the run
        # goes on as a miss, instead of waiting the default 10.
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: |
            ~/.cache/ms-playwright
            /var/cache/lk-apt/*.deb
          key: ${{ steps.playwright.outputs.key }}
          # A new Playwright on the same Ubuntu still needs most of the packages.
          restore-keys: ${{ steps.playwright.outputs.release }}

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Saved as soon as the install succeeds, so a test failure later does not
      # lose it. `autoclean` first drops packages Ubuntu has replaced, so a
      # cache carried over from an older key does not grow without end.
      - name: Drop replaced packages from the cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: sudo apt-get autoclean

      - name: Save the Playwright cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            /var/cache/lk-apt/*.deb
          key: ${{ steps.playwright.outputs.key }}

      - name: Build
        run: pnpm turbo run build

      - name: Run E2E tests
        run: pnpm turbo run e2e

      # Storybook: built, and every story opened in the browser above. A story
      # renders, or shows why it cannot: Storybook's own preview refuses content
      # lk-core would refuse (`.storybook/preview.tsx`).
      - name: Build Storybook
        run: pnpm --filter @intellectif/lk-storybook build-storybook

      - name: Render every story
        run: pnpm --filter @intellectif/lk-storybook smoke
