name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the LTS consumers run. 24 is the Node the Release job builds the
        # published tarball on. That job runs `pnpm release`, which runs
        # `verify-release` first: one turbo run of build, test, lint, typecheck
        # and the packaging checks, then api-check and size. This job splits
        # those steps and runs api-check and size on 22 only, so a task that
        # reads another's output without declaring it in turbo.json can pass
        # here and fail the release.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.8

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, test, and lint
        run: pnpm turbo run build test lint

      # Typecheck the FULL program, tests included. The build only compiles
      # src/, so type errors in test files went unnoticed for months — and a
      # released defect (redact() being uncallable with the SDK's own exported
      # interfaces) survived precisely because the suite that should have
      # caught it did not compile.
      - name: Typecheck (including tests)
        run: pnpm turbo run typecheck

      - name: Coverage
        if: matrix.node-version == '22'
        run: pnpm turbo run coverage

      - name: Bundle size
        if: matrix.node-version == '22'
        run: pnpm size

      # Public API surface gate. `verify-dist` proves the documented exports
      # RESOLVE; it says nothing about their shapes, so a parameter becoming
      # required, a return type narrowing, or a field leaving an exported
      # interface passed every check until a consumer's build broke. The
      # committed report is regenerated with `pnpm api-report`; a diff here is
      # the semver question asked while someone can still answer it.
      - name: Public API surface
        if: matrix.node-version == '22'
        run: pnpm api-check

      # Package-correctness gate. Catches the class of defect that only shows
      # up after publish: a broken exports map, a declaration that resolves as
      # the wrong module format, missing files in the tarball. Both packages
      # once shipped types that a CommonJS TypeScript consumer could not
      # import at all (attw "Masquerading as ESM") — this stops that silently
      # regressing. node10 resolution is ignored on purpose: it is TypeScript
      # < 4.7, and this SDK requires React 19.
      #
      # Runs on EVERY matrix Node, unlike coverage and size: `verify-dist`
      # replays lk-core's grade-stability corpus against the built package, and
      # the build that matters is the one made by the Release job's Node.
      - name: Packaging (publint + are-the-types-wrong + grade vectors)
        run: pnpm check-packaging
