name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the LTS consumers run. 24 is the Node the Release job builds the
        # published tarball on.
        node-version: [22, 24]
    steps:
      # Pinned to commits, as in release.yml; Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.0.8

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On the Release job's Node, exactly what the release runs before it
      # publishes: `pnpm release` is `verify-release` and then `changeset
      # publish`. One turbo run of build, test, lint, typecheck and the
      # packaging checks — publint, are-the-types-wrong, and verify-dist, which
      # replays the grade and validation corpora against the built package —
      # then the repository lint, the public API surface, the docs and release
      # notes, and the bundle sizes. Running the same command, not the same
      # steps split apart, is what catches a task that reads another's output
      # without declaring it in turbo.json: split, it passed here and failed the
      # release.
      - name: Everything the release verifies
        if: matrix.node-version == '24'
        run: pnpm verify-release

      # On the LTS consumers run: the packages built, linted and typechecked
      # (tests included — a released defect once survived because its test did
      # not compile), every test run once, with coverage, and the packaging
      # checks against this Node's build. `coverage` is the test run: running
      # `test` as well ran every suite twice.
      - name: Build, lint, typecheck, test with coverage, packaging
        if: matrix.node-version == '22'
        run: pnpm turbo run build lint typecheck coverage publint attw verify-dist
