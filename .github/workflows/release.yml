name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Least-privilege, OIDC-based. NO npm token is stored anywhere:
# `id-token: write` lets npm Trusted Publishing mint a short-lived,
# per-run identity (with provenance). `contents`/`pull-requests: write`
# are for the Changesets "version packages" PR via the built-in GITHUB_TOKEN.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.8

      - uses: actions/setup-node@v6
        with:
          # Node 24 LTS ships with npm 11.5+, which supports OIDC Trusted
          # Publishing natively — no self-upgrade step needed (the in-place
          # `npm install -g npm@…` upgrade hit npm's known `promise-retry`
          # MODULE_NOT_FOUND bug, where npm overwrites its own running
          # node_modules mid-process; --force doesn't help because the race
          # is in the require()s, not the integrity check).
          # CI (.github/workflows/ci.yml) stays on Node 22 — that's the LTS
          # most consumers will run, so that's what we test the SDK against.
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prerequisites (one-time, on npmjs.com): a Trusted Publisher must be
      # configured for EACH package (Package → Settings → Publishing access →
      # Trusted Publisher → GitHub Actions: this repo + workflow `release.yml`).
      # The very first publish of each package is done manually & interactively
      # by a maintainer (`npm login`, 2FA on) — see docs/releasing.md.
      - name: Create release PR or publish (OIDC, no stored token)
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
